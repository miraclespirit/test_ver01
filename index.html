<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Remote ЛИСА эдишн</title>
    <!-- Подключаем библиотеки -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        .info-text { font-size: 24px; color: #888; text-align: center; padding: 20px; }
        
        /* Панель пульта управления для iPad */
        .admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 20px; height: 35%; width: 100%; }
        .btn { flex: 1; font-size: 36px; font-weight: bold; border: none; color: #fff; border-radius: 15px; cursor: pointer; }
        .btn-next { background: #5cb85c; }
        .btn-prev { background: #d9534f; }
        .upload-zone { border: 3px dashed #444; border-radius: 15px; padding: 45px; text-align: center; font-size: 26px; margin-bottom: 20px; cursor: pointer; background: #1a1a1a; color: #5cb85c; }
    </style>
</head>
<body>

    <!-- ЭКРАН ДЛЯ СТУДЕНТОВ И ПК -->
    <div id="viewer-mode" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
        <div id="canvas-container">
            <div class="shield" oncontextmenu="return false;"></div>
            <div id="status-msg" class="info-text">Лекция готова к запуску.<br>Ожидание презентации от преподавателя...</div>
            <canvas id="pdf-canvas" style="display:none;"></canvas>
        </div>
    </div>

    <!-- ПУЛЬТ УПРАВЛЕНИЯ ДЛЯ IPAD (Всегда сработает) -->
    <div id="admin-mode" class="admin-panel">
        <div id="upload-area" class="upload-zone" onclick="document.getElementById('file-input').click()">
            👉 НАЖМИТЕ СЮДА, ЧТОБЫ ВЫБРАТЬ PDF С АЙПАДА
            <input type="file" id="file-input" accept="application/pdf" style="display:none;" onchange="handleFile(this.files)">
        </div>
        <div class="btn-group">
            <button class="btn btn-next" onclick="changePage(1)">ВПЕРЕД ▶</button>
            <button class="btn btn-prev" onclick="changePage(-1)">◀ НАЗАД</button>
        </div>
        <div style="margin-top:20px; font-size:26px; text-align:center; color:#aaa;" id="page-num">Текущая страница: 1</div>
        <button class="btn" style="background:#444; margin-top:auto; height:60px; font-size:20px;" onclick="location.reload()"> ЗАВЕРШИТЬ ЛЕКЦИЮ</button>
    </div>

    <script>
        // ШАГ 1: МГНОВЕННОЕ ВКЛЮЧЕНИЕ ИНТЕРФЕЙСА (До сетей и проверок)
        const urlParams = new URLSearchParams(window.location.search);
        const isTeacher = urlParams.has('boss');
        
        if (isTeacher) {
            document.getElementById('viewer-mode').style.display = 'none';
            document.getElementById('admin-mode').style.display = 'flex';
        }

        // ШАГ 2: ИНИЦИАЛИЗАЦИЯ ДВИЖКА ПРЕЗЕНТАЦИИ
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const roomID = "lisa_edition_room_99421"; // Секретная комната связи
        
        let pdfDoc = null;
        let pageNum = 1;
        let client = null;

        // Безопасное подключение к сети, чтобы не повесить интерфейс iPad
        try {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            client.on('connect', () => { client.subscribe(roomID); });
            
            client.on('message', (topic, message) => {
                try {
                    const msg = JSON.parse(message.toString());
                    if (!isTeacher) {
                        if (msg.type === "FILE") { loadPDF(msg.data); }
                        if (msg.type === "PAGE") { renderPage(msg.num); }
                    }
                } catch(e) { console.log(e); }
            });
        } catch(err) {
            console.log("Сетевой шлюз инициализируется...");
        }

        // Выбор файла на iPad
        function handleFile(files) {
            if (!files.length) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                if(client && client.connected) {
                    client.publish(roomID, JSON.stringify({ type: "FILE", data: base64Data }));
                }
                loadPDF(base64Data);
                document.getElementById('upload-area').innerText = `ФАЙЛ УСПЕШНО ЗАГРУЖЕН!`;
                document.getElementById('upload-area').style.borderColor = '#5cb85c';
                document.getElementById('upload-area').style.color = '#5cb85c';
            };
            reader.readAsDataURL(files);
        }

        // Кнопки пульта
        function changePage(direction) {
            if (!pdfDoc) return;
            pageNum += direction;
            if (pageNum < 1) pageNum = 1;
            if (pageNum > pdfDoc.numPages) pageNum = pdfDoc.numPages;
            
            if(client && client.connected) {
                client.publish(roomID, JSON.stringify({ type: "PAGE", num: pageNum }));
            }
            document.getElementById('page-num').innerText = `Текущая страница: ${pageNum}`;
        }

        function loadPDF(dataUrl) {
            pdfjsLib.getDocument(dataUrl).promise.then((pdf) => {
                pdfDoc = pdf;
                document.getElementById('status-msg').style.display = 'none';
                document.getElementById('pdf-canvas').style.display = 'block';
                renderPage(1);
            }).catch(err => {
                document.getElementById('status-msg').innerText = "Ошибка загрузки PDF-файла.";
            });
        }

        function renderPage(num) {
            if (!pdfDoc) return;
            pdfDoc.getPage(num).then((page) => {
                const canvas = document.getElementById('pdf-canvas');
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 2.0 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                page.render({ canvasContext: ctx, viewport: viewport });
            });
        }
    </script>
</body>
</html>
