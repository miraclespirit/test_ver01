<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой PDF Remote</title>
    <!-- Подключаем PDF-плеер и систему связи, работающие в чебурнете -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        #canvas-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        .shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        /* Панель управления на iPad */
        .admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 20px; height: 30%; }
        .btn { flex: 1; font-size: 32px; font-weight: bold; border: none; color: #fff; border-radius: 15px; cursor: pointer; }
        .btn-next { background: #5cb85c; }
        .btn-prev { background: #d9534f; }
        .upload-zone { border: 3px dashed #444; border-radius: 15px; padding: 40px; text-align: center; font-size: 24px; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ЭКРАН ДЛЯ СТУДЕНТОВ И ПК -->
    <div id="viewer-mode">
        <div id="canvas-container">
            <div class="shield" oncontextmenu="return false;"></div>
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>

    <!-- ПУЛЬТ УПРАВЛЕНИЯ ДЛЯ IPAD -->
    <div id="admin-mode" class="admin-panel">
        <div id="upload-area" class="upload-zone" onclick="document.getElementById('file-input').click()">
             Нажмите сюда, чтобы загрузить PDF с iPad
            <input type="file" id="file-input" accept="application/pdf" style="display:none;" onchange="handleFile(this.files[0])">
        </div>
        <div class="btn-group">
            <button class="btn btn-next" onclick="changePage(1)">ВПЕРЕД ▶</button>
            <button class="btn btn-prev" onclick="changePage(-1)">◀ НАЗАД</button>
        </div>
        <div style="margin-top:20px; font-size:24px; text-align:center;" id="page-num">Страница: 1</div>
        <button class="btn" style="background:#555; margin-top:auto; height:50px; font-size:18px;" onclick="location.reload()">⏹ ЗАВЕРШИТЬ ТРАНСЛЯЦИЮ</button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

        const urlParams = new URLSearchParams(window.location.search);
        const isTeacher = urlParams.has('boss');
        const roomID = "my_secret_pdf_remote_room_88421"; // Измените эти цифры на свои, чтобы создать секретный канал
        
        let pdfDoc = null;
        let pageNum = 1;
        let client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        client.on('connect', () => { client.subscribe(roomID); });

        if (isTeacher) {
            document.getElementById('viewer-mode').style.display = 'none';
            document.getElementById('admin-mode').style.display = 'flex';
        }

        // Выбор PDF файла на iPad
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                // Отправляем всю презентацию по воздуху на ПК и студентам
                client.publish(roomID, JSON.stringify({ type: "FILE", data: base64Data }));
                loadPDF(base64Data);
                document.getElementById('upload-area').innerText = `Файл загружен: ${file.name}`;
            };
            reader.readAsDataURL(file);
        }

        // Листание кнопками на iPad
        function changePage(direction) {
            pageNum += direction;
            if (pageNum < 1) pageNum = 1;
            if (pdfDoc && pageNum > pdfDoc.numPages) pageNum = pdfDoc.numPages;
            
            // Шлем команду переключения страницы
            client.publish(roomID, JSON.stringify({ type: "PAGE", num: pageNum }));
            document.getElementById('page-num').innerText = `Страница: ${pageNum}`;
        }

        // Прием данных смартфонами студентов и ПК
        client.on('message', (topic, message) => {
            const msg = JSON.parse(message.toString());
            if (!isTeacher) {
                if (msg.type === "FILE") { loadPDF(msg.data); }
                if (msg.type === "PAGE") { renderPage(msg.num); }
            }
        });

        function loadPDF(dataUrl) {
            pdfjsLib.getDocument(dataUrl).promise.then((pdf) => {
                pdfDoc = pdf;
                renderPage(1);
            });
        }

        function renderPage(num) {
            pdfDoc.getPage(num).then((page) => {
                const canvas = document.getElementById('pdf-canvas');
                const ctx = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                page.render({ canvasContext: ctx, viewport: viewport });
            });
        }
    </script>
</body>
</html>
